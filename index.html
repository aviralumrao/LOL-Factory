<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOL Factory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="heading">LOL Factory</h1>
    <h2 class="heading">Random Meme Generator</h2>

    <h3 class="text">Select the meme template</h3>
    <div class="collection">
      <div class="meme">
        <div class="meme-image">
          <img id="spiderman" src="memes/spider-man.jpg" alt="spiderman meme" />
        </div>
        <button onclick="draw('spiderman')">Try it</button>
      </div>
    </div>
    <canvas id="myCanvas" width="400" height="400"></canvas>

    <script src="app.js"></script>
  </body>
</html>
